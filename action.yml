name: 'X4 Agent Security Scanner'
description: 'Scan AI agent skills, hooks and MCP configs; emit SARIF'
author: 'ARIEX4Ops'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  sarif:
    description: 'Upload SARIF to code scanning'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Run scanner (placeholder)
      shell: bash
      run: |
        echo "X4 Security scan on ${{ inputs.path }}"
        echo "{\"version\":\"2.1.0\",\"runs\":[]}" > x4-sec.sarif
    - name: Upload SARIF
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: x4-sec.sarif
      continue-on-error: true
